<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="0; url=https://github.com/Kamide" http-equiv="refresh" />
    <title>Redirecting</title>
    <style>
      :root {
        font-size: 18px;
      }
      body {
        margin: 0;
        background: #f1f1f1;
        color: #303030;
        font-family: system-ui, sans-serif;
        text-align: center;
        text-wrap: balance;
      }
      main {
        margin-block: 9svh;
        padding: 1rem;
      }
      p {
        margin-block: 1rem;
      }
      a {
        color: #0666f6;
        font-weight: bold;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .lead {
        font-size: 1.25rem;
      }
      .instruction {
        color: #909090;
        font-style: italic;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="lead">
        Redirecting to
        <a href="https://github.com/Kamide">github.com/Kamide</a>&hellip;
      </p>
      <p class="instruction">
        Please click the link above if you are not automatically redirected.
      </p>
    </main>
  </body>
</html>
